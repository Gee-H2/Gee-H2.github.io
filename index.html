<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Gift Udoh">
<meta property="og:type" content="website">
<meta property="og:title" content="Gift Udoh">
<meta property="og:description" content="PhD researcher in energy systems at Heriot-Watt University — digital twins and storage for net-zero business parks.">
<title>Gift Udoh</title>
<meta name="description" content="PhD researcher in energy systems at Heriot-Watt University — digital twins and storage for net-zero business parks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231D6A5A'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23F6F5EE' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEEDE4; --paper-2:#E4E3D6; --card:#F6F5EE;
  --ink:#17201C; --muted:#5B635D; --rule:#CAC9B8;
  --accent:#1D6A5A; --accent-soft:#D3E2DA; --ochre:#9E6C14; --ochre-2:#C99A45;
  --serif:"Newsreader",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter:clamp(16px,4vw,44px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111613;--paper-2:#171E1A;--card:#19211C;--ink:#E6E5DA;--muted:#9BA29B;
  --rule:#2E3832;--accent:#7CC7AF;--accent-soft:#1F3A31;--ochre:#D9A64C;--ochre-2:#8E6A2A;color-scheme:dark;}}
:root[data-theme="dark"]{--paper:#111613;--paper-2:#171E1A;--card:#19211C;--ink:#E6E5DA;--muted:#9BA29B;
  --rule:#2E3832;--accent:#7CC7AF;--accent-soft:#1F3A31;--ochre:#D9A64C;--ochre-2:#8E6A2A;color-scheme:dark;}
*{box-sizing:border-box}html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--gutter)}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:60px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:20px}
.mark i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--ochre-2),var(--ochre))}
.nav{margin-left:auto;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap;padding-block:6px}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--accent);margin-right:4px}
.theme-btn{background:none;border:1px solid var(--rule);border-radius:20px;color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 10px;cursor:pointer}
.hero{padding-block:clamp(40px,7vw,80px) clamp(36px,6vw,64px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:start}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.kicker{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);text-transform:uppercase}
.kicker span+span::before{content:"·";margin-right:14px;color:var(--rule)}
.hero h1{font-size:clamp(38px,6vw,74px);line-height:1.03;letter-spacing:-.02em;margin-top:20px}
.hero h1 em{font-style:italic;color:var(--accent)}
.byline{margin-top:26px;font-family:var(--serif);font-size:22px}
.affil{margin-top:6px;color:var(--muted);font-size:13.5px;line-height:1.55}
.abstract{margin-top:28px;border-top:1px solid var(--rule);padding-top:18px;max-width:62ch}
.abstract .lbl{color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block;font-size:12px;letter-spacing:.08em}
.abstract p{font-size:18px}
.keywords{margin-top:14px;color:var(--muted);font-size:14px}.keywords b{color:var(--ink)}
.figure{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px}
.figure canvas{width:100%;height:210px;display:block;border-radius:8px;background:var(--paper-2)}
.figcap{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.5}
.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--rule);margin-bottom:14px}
.reader{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px}
.reader .lbl{color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.reader .note{margin-top:12px;font-size:14.5px;color:var(--muted)}
section.sec{border-top:1px solid var(--rule);padding-block:clamp(34px,5vw,60px)}
.sec h2{font-size:clamp(26px,3.4vw,38px)}
.sec .num{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sec .lead{font-family:var(--serif);font-size:20px;margin-top:6px;color:var(--ink)}
.sec .body{margin-top:16px;max-width:70ch;color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:20px}@media(max-width:760px){.grid3{grid-template-columns:1fr}}
.grid3 h3{font-size:16px;font-family:var(--sans);font-weight:600;margin-bottom:8px}
.grid3 ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}.grid3 li{margin-bottom:4px}
.pub{border-top:1px solid var(--rule);padding-block:16px}.pub:first-of-type{border-top:none}
.pub .t{font-family:var(--serif);font-size:19px}.pub .m{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:4px}
.pub .n{color:var(--muted);font-size:14.5px;margin-top:6px}
.tl{margin-top:20px}.tl .row{display:grid;grid-template-columns:150px 1fr;gap:18px;padding-block:14px;border-top:1px solid var(--rule)}
@media(max-width:640px){.tl .row{grid-template-columns:1fr;gap:4px}}
.tl .when{font-family:var(--mono);font-size:12.5px;color:var(--accent)}.tl .what{font-family:var(--serif);font-size:18px}.tl .note{color:var(--muted);font-size:14px;margin-top:4px}
.links{margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:640px}@media(max-width:560px){.links{grid-template-columns:1fr}}
.lk{display:flex;justify-content:space-between;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;text-decoration:none;background:var(--card)}
.lk .k{color:var(--muted);font-size:13px}.lk .v{font-family:var(--mono);font-size:13px}
footer{border-top:1px solid var(--rule);padding-block:30px;color:var(--muted);font-size:13px}
.noscript{padding:14px;border:1px dashed var(--rule);border-radius:10px;margin:20px 0;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#top"><i></i><span id="wordmark">G. Udoh</span></a>
  <nav class="nav" id="nav"></nav>
  <button class="theme-btn" id="theme" aria-label="Toggle theme">THEME</button>
</div></header>

<main class="wrap" id="app" tabindex="-1">
  <noscript><div class="noscript">This site renders its content with a small script. Enable JavaScript, or read the source content in <a href="content.json">content.json</a>.</div></noscript>
</main>

<footer><div class="wrap" id="footer">© 2026 Gift Udoh</div></footer>

<script>
const esc=s=>String(s==null?"":s);
// minimal markdown: **bold**, *italic/accent*, [text](url)
function md(t){return esc(t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/\*(.+?)\*/g,'<em>$1</em>')
  .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');}

function render(d){
  document.getElementById("wordmark").textContent=d.site.wordmark||d.site.title;
  document.getElementById("footer").textContent=d.site.footer||("© "+d.site.title);
  document.title=d.site.title;
  const h=d.hero, app=document.getElementById("app");
  const secNav=(d.sections||[]).map(s=>`<a href="#${s.id}"><b>${s.number||""}</b>${esc(s.title)}</a>`).join("");
  document.getElementById("nav").innerHTML=secNav;

  let html=`<section class="hero" id="top">
    <div>
      <div class="kicker mono">${(h.kicker||[]).map(k=>`<span>${esc(k)}</span>`).join("")}</div>
      <h1>${md(h.headline)}</h1>
      <div class="byline">${esc(h.name)}</div>
      <div class="affil">${(h.affiliations||[]).map(a=>esc(a)).join("<br>")}</div>
      <div class="abstract"><span class="lbl mono">Abstract</span><p>${md(h.abstract)}</p>
        <div class="keywords"><b>Keywords —</b> ${(h.keywords||[]).join(", ")}</div>
      </div>
      ${h.reader&&h.reader.show?readerBlock(h.reader):""}
    </div>
    <aside>
      ${h.photo?`<img class="photo" src="${esc(h.photo)}" alt="${esc(h.name)}" onerror="this.style.display='none'">`:""}
      ${h.figure&&h.figure.show?`<div class="figure"><canvas id="fig" width="600" height="210" aria-label="PV vs demand figure"></canvas><div class="figcap">${md(h.figure.caption)}</div></div>`:""}
    </aside>
  </section>`;

  html+=(d.sections||[]).map(renderSection).join("");
  app.insertAdjacentHTML("beforeend",html);
  if(h.figure&&h.figure.show) drawFig();
  wireReader(); wireScrollSpy();
}
function readerBlock(r){
  return `<div class="reader"><span class="lbl mono">Reading as</span>
    <div class="note">${md(r.intro)}</div>
    <div class="chips">${r.paths.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p.label)}</button>`).join("")}</div>
    <div class="note" id="readerNote"></div></div>`;
}
function renderSection(s){
  let inner="";
  if(s.lead) inner+=`<div class="lead">${md(s.lead)}</div>`;
  if(s.body) inner+=`<div class="body">${md(s.body)}</div>`;
  if(s.kind==="columns") inner+=`<div class="grid3">${(s.columns||[]).map(c=>`<div><h3>${esc(c.heading)}</h3><ul>${c.items.map(i=>`<li>${md(i)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(s.kind==="list") inner+=(s.items||[]).map(it=>`<div class="pub"><div class="t">${md(it.title)}</div>${it.meta?`<div class="m">${esc(it.meta)}</div>`:""}${it.note?`<div class="n">${md(it.note)}</div>`:""}</div>`).join("");
  if(s.kind==="timeline") inner+=`<div class="tl">${(s.items||[]).map(it=>`<div class="row"><div class="when">${esc(it.when)}</div><div><div class="what">${md(it.what)}</div>${it.note?`<div class="note">${md(it.note)}</div>`:""}</div></div>`).join("")}</div>`;
  if(s.kind==="links") inner+=`<div class="links">${(s.items||[]).map(it=>`<a class="lk" href="${esc(it.href)}"><span class="k">${esc(it.label)}</span><span class="v">${esc(it.value)}</span></a>`).join("")}</div>`;
  return `<section class="sec" id="${s.id}"><div class="num mono">§ ${esc(s.number)}</div><h2>${esc(s.title)}</h2>${inner}</section>`;
}
function wireReader(){
  const notes=(window.__data.hero.reader||{}).paths||[];
  document.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const p=notes[+btn.dataset.i];
    document.getElementById("readerNote").innerHTML=md(p.note);
  }));
}
function wireScrollSpy(){
  const links=[...document.querySelectorAll(".nav a")];
  const map=new Map(links.map(a=>[a.getAttribute("href").slice(1),a]));
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove("on"));const a=map.get(e.target.id);if(a)a.classList.add("on");}}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section.sec, #top").forEach(s=>obs.observe(s));
}
// PV vs demand interactive figure
function drawFig(){
  const c=document.getElementById("fig");if(!c)return;const ctx=c.getContext("2d");
  const W=c.width,H=c.height,pad=20;let mx=-1;
  const cs=getComputedStyle(document.documentElement);
  const demand=[],pv=[];for(let h=0;h<24;h++){demand.push(0.45+0.30*Math.exp(-((h-8)**2)/8)+0.42*Math.exp(-((h-19)**2)/6));pv.push(Math.max(0,Math.sin((h-6)/12*Math.PI))*0.9);}
  function line(arr,col){ctx.beginPath();arr.forEach((v,i)=>{const x=pad+i/23*(W-2*pad),y=H-pad-v*(H-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.stroke();}
  function draw(){ctx.clearRect(0,0,W,H);
    const accent=cs.getPropertyValue("--accent").trim()||"#1D6A5A";const ochre=cs.getPropertyValue("--ochre").trim()||"#9E6C14";
    line(pv,ochre);line(demand,accent);
    if(mx>=0){const i=Math.round((mx-pad)/(W-2*pad)*23);if(i>=0&&i<24){const x=pad+i/23*(W-2*pad);ctx.strokeStyle=cs.getPropertyValue("--rule").trim()||"#ccc";ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,H-pad);ctx.stroke();
      ctx.fillStyle=cs.getPropertyValue("--muted").trim()||"#666";ctx.font='11px monospace';ctx.fillText(`${i}:00  gap ${(demand[i]-pv[i]).toFixed(2)}`,Math.min(x+6,W-120),pad+12);}}}
  c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);draw();});
  c.addEventListener("mouseleave",()=>{mx=-1;draw();});
  draw();
}
// theme toggle
document.getElementById("theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("theme",next)}catch(e){}
  if(window.__data&&window.__data.hero.figure&&window.__data.hero.figure.show)drawFig();
});
(()=>{try{const t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();

fetch("content.json").then(r=>r.json()).then(d=>{window.__data=d;render(d);})
  .catch(e=>{document.getElementById("app").insertAdjacentHTML("beforeend",`<p style="color:var(--muted);padding:40px 0">Could not load content.json — ${esc(e.message)}. If you opened this file directly, run a local web server (browsers block file:// fetch).</p>`);});
</script>
</body>
</html>
