<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#EEEDE4;font-family:"Hanken Grotesk",system-ui,sans-serif;color:#17201C;padding:40px}
  h1{font-family:Georgia,serif;font-weight:400}
  .grid{display:grid;grid-template-columns:1fr;gap:24px;max-width:820px}
  .card{background:#F6F5EE;border:1px solid #CAC9B8;border-radius:16px;padding:24px}
  .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;color:#5B635D;text-transform:uppercase;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:34px;flex-wrap:wrap}
  .swatch{display:flex;align-items:center;gap:16px}
  .dark{background:#111613;border-radius:12px;padding:14px 18px}
  .name{font-family:Georgia,serif;font-size:22px}
  .cap{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#5B635D;text-align:center;margin-top:6px}
</style></head>
<body>
<h1>Refined concepts — A, C, D</h1>
<div class="grid">

  <!-- ============ A refined: clean interlocking G + U ============ -->
  <div class="card">
    <div class="lbl">A · Interlocking G + U — refined for legibility</div>
    <div class="row">
      <!-- A1: G ring open at right, U nested cleanly, clearly two letters -->
      <div>
        <svg width="76" height="76" viewBox="0 0 76 76">
          <!-- G: arc + inner bar -->
          <path d="M50 24 A19 19 0 1 0 52 50" fill="none" stroke="#1D6A5A" stroke-width="6.5" stroke-linecap="round"/>
          <path d="M52 40 L52 50 L42 50" fill="none" stroke="#1D6A5A" stroke-width="6.5" stroke-linecap="round"/>
          <!-- U: sits inside lower-right, ochre -->
          <path d="M40 40 L40 50 A9 9 0 0 0 58 50 L58 40" fill="none" stroke="#9E6C14" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <div class="cap">A1</div>
      </div>
      <!-- A2: side-by-side ligature, both letters full height -->
      <div>
        <svg width="96" height="76" viewBox="0 0 96 76">
          <path d="M40 22 A20 20 0 1 0 42 54 L42 40 L30 40" fill="none" stroke="#1D6A5A" stroke-width="7" stroke-linecap="round"/>
          <path d="M52 22 L52 46 A14 14 0 0 0 80 46 L80 22" fill="none" stroke="#9E6C14" stroke-width="7" stroke-linecap="round"/>
        </svg>
        <div class="cap">A2 — G U side by side</div>
      </div>
      <div class="dark swatch">
        <svg width="72" height="72" viewBox="0 0 96 76">
          <path d="M40 22 A20 20 0 1 0 42 54 L42 40 L30 40" fill="none" stroke="#7CC7AF" stroke-width="7" stroke-linecap="round"/>
          <path d="M52 22 L52 46 A14 14 0 0 0 80 46 L80 22" fill="none" stroke="#D9A64C" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ============ C refined: digital-twin dot + lockup ============ -->
  <div class="card">
    <div class="lbl">C · Digital-twin dot — refined proportions + name lockup</div>
    <div class="row">
      <div>
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle cx="33" cy="40" r="19" fill="#1D6A5A"/>
          <circle cx="47" cy="40" r="19" fill="none" stroke="#9E6C14" stroke-width="3.5"/>
        </svg>
        <div class="cap">C1 — mark</div>
      </div>
      <!-- lockup -->
      <div class="swatch">
        <svg width="52" height="52" viewBox="0 0 80 80"><circle cx="33" cy="40" r="19" fill="#1D6A5A"/><circle cx="47" cy="40" r="19" fill="none" stroke="#9E6C14" stroke-width="3.5"/></svg>
        <span class="name">Gift Udoh</span>
      </div>
      <div class="dark swatch">
        <svg width="52" height="52" viewBox="0 0 80 80"><circle cx="33" cy="40" r="19" fill="#7CC7AF"/><circle cx="47" cy="40" r="19" fill="none" stroke="#D9A64C" stroke-width="3.5"/></svg>
        <span class="name" style="color:#E6E5DA">Gift Udoh</span>
      </div>
    </div>
    <div class="cap" style="text-align:left;margin-top:12px">C2 — tighter overlap variant</div>
    <div class="row" style="margin-top:8px">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="36" cy="40" r="19" fill="#1D6A5A"/>
        <circle cx="44" cy="40" r="19" fill="none" stroke="#9E6C14" stroke-width="3.5"/>
      </svg>
    </div>
  </div>

  <!-- ============ D refined: G energy curve ============ -->
  <div class="card">
    <div class="lbl">D · G as energy curve — refined</div>
    <div class="row">
      <div>
        <!-- D1: G with a small sine "spark" tail instead of a plain bar -->
        <svg width="80" height="80" viewBox="0 0 80 80">
          <path d="M56 28 A22 22 0 1 0 58 54 L58 42 L45 42" fill="none" stroke="#1D6A5A" stroke-width="6.5" stroke-linecap="round"/>
          <circle cx="40" cy="40" r="3.5" fill="#9E6C14"/>
        </svg>
        <div class="cap">D1 — G + core dot</div>
      </div>
      <div>
        <!-- D2: G where the inner bar becomes a small PV curve -->
        <svg width="80" height="80" viewBox="0 0 80 80">
          <path d="M56 28 A22 22 0 1 0 58 54" fill="none" stroke="#1D6A5A" stroke-width="6.5" stroke-linecap="round"/>
          <path d="M40 44 q4 -10 8 0 t8 0" fill="none" stroke="#9E6C14" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="cap">D2 — G + PV curve inside</div>
      </div>
      <div class="dark swatch">
        <svg width="66" height="66" viewBox="0 0 80 80">
          <path d="M56 28 A22 22 0 1 0 58 54 L58 42 L45 42" fill="none" stroke="#7CC7AF" stroke-width="6.5" stroke-linecap="round"/>
          <circle cx="40" cy="40" r="3.5" fill="#D9A64C"/>
        </svg>
      </div>
    </div>
  </div>

</div>
</body></html>
