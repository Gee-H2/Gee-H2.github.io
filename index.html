<style>
:root{
  --paper:#EEEDE4;--paper-2:#E4E3D6;--card:#F6F5EE;--ink:#17201C;--muted:#5B635D;--rule:#CAC9B8;
  --accent:#1D6A5A;--accent-soft:#D3E2DA;--ochre:#9E6C14;--ochre-2:#C99A45;

  --gutter:clamp(16px,4vw,44px);color-scheme:light;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111613;--paper-2:#171E1A;--card:#19211C;--ink:#E6E5DA;--muted:#9BA29B;--rule:#2E3832;--accent:#7CC7AF;--accent-soft:#1F3A31;--ochre:#D9A64C;--ochre-2:#8E6A2A;color-scheme:dark;}}
:root[data-theme="dark"]{--paper:#111613;--paper-2:#171E1A;--card:#19211C;--ink:#E6E5DA;--muted:#9BA29B;--rule:#2E3832;--accent:#7CC7AF;--accent-soft:#1F3A31;--ochre:#D9A64C;--ochre-2:#8E6A2A;color-scheme:dark;}
*{box-sizing:border-box}html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--gutter)}
.progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:30}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;position:relative}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:20px}
.mark i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--ochre-2),var(--ochre))}
.nav{margin-left:auto;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap;padding-block:6px}
.nav a:hover,.nav a.on{color:var(--ink)}.nav a b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--accent);margin-right:4px}
.btn{background:none;border:1px solid var(--rule);border-radius:20px;color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 10px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.hamburger{display:none;flex-direction:column;justify-content:center;gap:4px;width:38px;height:34px;background:none;border:1px solid var(--rule);border-radius:9px;cursor:pointer;padding:0}
.hamburger span{display:block;width:16px;height:1.6px;background:var(--ink);margin-inline:auto;transition:transform .25s,opacity .2s}
.hamburger[aria-expanded="true"] span:nth-child(1){transform:translateY(5.6px) rotate(45deg)}
.hamburger[aria-expanded="true"] span:nth-child(2){opacity:0}
.hamburger[aria-expanded="true"] span:nth-child(3){transform:translateY(-5.6px) rotate(-45deg)}
@media(max-width:640px){
  .hamburger{display:flex}
  .hintbar{display:none}
  #theme{display:none}
  .nav{position:absolute;top:100%;left:0;right:0;margin:0;flex-direction:column;gap:0;
    background:var(--paper);border-bottom:1px solid var(--rule);overflow:hidden;max-height:0;transition:max-height .3s ease}
  .nav.open{max-height:80vh;overflow:auto}
  .nav a{padding:14px var(--gutter);border-top:1px solid var(--rule);font-size:16px;color:var(--ink)}
  .nav a:first-child{border-top:none}
}
.hero{padding-block:clamp(40px,7vw,80px) clamp(36px,6vw,64px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,5vw,56px);align-items:start}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.kicker{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);text-transform:uppercase}
.kicker span+span::before{content:"·";margin-right:14px;color:var(--rule)}
.hero h1{font-size:clamp(38px,6vw,74px);line-height:1.03;letter-spacing:-.02em;margin-top:20px}
.hero h1 em{font-style:italic;color:var(--accent)}
.byline{margin-top:26px;font-family:var(--serif);font-size:22px}
.affil{margin-top:6px;color:var(--muted);font-size:13.5px;line-height:1.55}
.abstract{margin-top:28px;border-top:1px solid var(--rule);padding-top:18px;max-width:62ch}
.abstract .lbl{color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block;font-size:12px;letter-spacing:.08em}
.abstract p{font-size:18px}.keywords{margin-top:14px;color:var(--muted);font-size:14px}.keywords b{color:var(--ink)}
.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--rule);margin-bottom:14px}
/* live sim */
.sim{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px}
.sim .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sim .cap .t{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.sim canvas{width:100%;height:190px;display:block;border-radius:8px;background:var(--paper-2);touch-action:none}
.sim .ctl{margin-top:12px}
.sim .ctl label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.sim input[type=range]{width:100%;accent-color:var(--accent);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:9px 6px;text-align:center}
.kpi .v{font-family:var(--serif);font-size:19px;color:var(--ink);white-space:nowrap}.kpi .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.tg{display:flex;gap:6px}
.tg .chip{padding:5px 11px;font-size:12.5px}
.ctl.mini{margin-top:10px;border-top:1px solid var(--rule);padding-top:12px}
.ctl.mini label{margin-top:8px}
.figcap{margin-top:10px;color:var(--muted);font-size:12.5px;line-height:1.5}
.reader{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px}
.reader .lbl{color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.reader .note{margin-top:12px;font-size:14.5px;color:var(--muted)}
section.sec{border-top:1px solid var(--rule);padding-block:clamp(34px,5vw,58px);opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;
  display:grid;grid-template-columns:150px minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
@media(max-width:760px){section.sec{grid-template-columns:1fr;gap:10px}}
section.sec.in{opacity:1;transform:none}
section.sec.spot{box-shadow:-16px 0 0 -13px var(--accent)}
.sec .head{position:sticky;top:78px}
@media(max-width:760px){.sec .head{position:static}}
.sec h2{font-size:clamp(24px,2.8vw,32px);margin-top:4px}.sec .num{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sec .content{min-width:0}
.sec .lead{font-family:var(--serif);font-size:20px}.sec .body{margin-top:14px;max-width:68ch}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:20px}@media(max-width:760px){.grid3{grid-template-columns:1fr}}
.rfig{margin-top:22px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px}
.rf-chart{display:flex;align-items:flex-end;gap:14px;height:150px}
.rf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.rf-bar{width:100%;max-width:54px;background:linear-gradient(var(--accent),var(--accent-soft));border-radius:6px 6px 0 0;position:relative;min-height:4px;transition:filter .2s}
.rf-bar:hover{filter:brightness(1.15)}
.rf-val{position:absolute;top:-20px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink)}
.rf-lab{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:6px}
.rf-sub{font-size:10.5px;color:var(--muted);text-align:center}
.rf-axis{color:var(--muted);margin-top:10px;font-size:11px}
.grid3 h3{font-size:16px;font-family:var(--sans);font-weight:600;margin-bottom:8px}.grid3 ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}.grid3 li{margin-bottom:4px}
.pub{border-top:1px solid var(--rule);padding-block:16px}.pub:first-of-type{border-top:none}
.pub .t{font-family:var(--serif);font-size:19px}.pub .m{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:4px}.pub .n{color:var(--muted);font-size:14.5px;margin-top:6px}
.pub.feat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-block:6px}
.pub.feat:first-of-type{border:1px solid var(--rule)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);border-radius:20px;padding:2px 8px;margin-right:10px;vertical-align:middle}
.tag-key{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.cta{margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}
.cta-text{font-family:var(--serif);font-size:18px;color:var(--ink);max-width:54ch}
.cta-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.cta-btn{text-decoration:none;font-size:14px;padding:9px 16px;border:1px solid var(--rule);border-radius:22px;color:var(--ink);transition:border-color .2s,background .2s}
.cta-btn:hover{border-color:var(--accent);color:var(--accent)}
.cta-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.cta-btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tl{margin-top:20px}.tl .row{display:grid;grid-template-columns:150px 1fr;gap:18px;padding-block:14px;border-top:1px solid var(--rule)}@media(max-width:640px){.tl .row{grid-template-columns:1fr;gap:4px}}
.tl .when{font-family:var(--mono);font-size:12.5px;color:var(--accent)}.tl .what{font-family:var(--serif);font-size:18px}.tl .note{color:var(--muted);font-size:14px;margin-top:4px}
.iconrow{margin-top:22px;display:flex;flex-wrap:wrap;gap:14px}
.iconlk{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:12px;background:var(--card);color:var(--muted);text-decoration:none;transition:color .2s,border-color .2s,transform .2s,background .2s}
.iconlk:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.iconlk .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s}
.iconlk:hover .tip,.iconlk:focus-visible .tip{opacity:1}
footer{border-top:1px solid var(--rule);padding-block:30px;color:var(--muted);font-size:13px}
/* command palette */
.pal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:none;z-index:40;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.open{display:flex}
.pal .box{width:min(560px,92vw);background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
.pal input{width:100%;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:16px;padding:16px 18px;border-bottom:1px solid var(--rule);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.pal li{padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:15px}
.pal li.sel,.pal li:hover{background:var(--accent-soft)}
.pal li .hint{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hintbar{margin-left:12px}.hintbar kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);border-radius:4px;padding:1px 5px;color:var(--muted)}
.noscript{padding:14px;border:1px dashed var(--rule);border-radius:10px;margin:20px 0;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:50}
.toast.show{opacity:1}
/* ---- mobile hardening ---- */
html,body{overflow-x:hidden;max-width:100%}
.wrap{width:100%}
.sim,.gridcard,.abstract,.sec .content{min-width:0}
@media(max-width:560px){
  .hero h1{font-size:clamp(32px,10vw,44px);word-break:break-word}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{white-space:normal;font-size:17px}
  .kpi .l{font-size:9px}
  .toggles{gap:10px}
  .tg{flex-wrap:wrap}
  .kicker{font-size:11px}
}
@media(max-width:400px){.hero h1{font-size:32px}}

.gridcard{margin:24px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
@media(max-width:560px){.gridcard{grid-template-columns:1fr;text-align:center}}
.gridcard canvas{width:110px;height:72px;display:block;margin-inline:auto}
.gridcard .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.gridcard .s{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.technote{margin-top:10px;color:var(--muted);font-size:12.5px;line-height:1.5;background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
</style>
</head>

const esc=s=>String(s==null?"":s);
const pad2=n=>String(n).padStart(2,"0");
function md(t){return esc(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,'<em>$1</em>')
  .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}

};


let DATA, baseOrder=[];
function render(d){
  DATA=d;
  document.getElementById("wordmark").textContent=d.site.wordmark||d.site.title;
  document.getElementById("footer").innerHTML=esc(d.site.footer||("© "+d.site.title))+' · <a href="https://github.com/Gee-H2/Gee-H2.github.io/edit/main/content.json" style="color:var(--muted);text-decoration-color:var(--rule)">edit</a>';
  document.title=d.site.title;
  const h=d.hero;
  document.getElementById("nav").innerHTML=(d.sections||[]).map(s=>`<a href="#${s.id}"><b>${s.number?pad2(s.number):""}</b>${esc(s.title)}</a>`).join("");
  let html=`<section class="hero" id="top">
    <div>
      <div class="kicker mono">${(h.kicker||[]).map(k=>`<span>${esc(k)}</span>`).join("")}</div>
      <h1>${md(h.headline)}</h1>
      <div class="byline">${esc(h.name)}</div>
      <div class="affil">${(h.affiliations||[]).map(esc).join("<br>")}</div>
      <div class="abstract"><span class="lbl mono">Abstract</span><p>${md(h.abstract)}</p>
        <div class="keywords"><b>Keywords —</b> ${(h.keywords||[]).join(", ")}</div></div>
      ${h.cta?`<div class="cta"><p class="cta-text">${md(h.cta.text)}</p><div class="cta-btns">${(h.cta.buttons||[]).map((b,i)=>`<a class="cta-btn${i===0?' primary':''}" href="${esc(b.href)}">${esc(b.label)}</a>`).join("")}</div></div>`:""}
      ${h.reader&&h.reader.show?readerBlock(h.reader):""}
      <div id="gridslot"></div>
    </div>
    <aside>
      ${h.photo?`<img class="photo" src="${esc(h.photo)}" alt="${esc(h.name)}" onerror="this.style.display='none'">`:""}
      <div class="sim">
        <div class="cap"><span class="t">Fig. 1 — live digital twin</span><span class="t" id="capval"></span></div>
        <canvas id="simCanvas" aria-label="Interactive storage dispatch model"></canvas>
        <div class="kpis">
          <div class="kpi"><div class="v" id="kSolar">–</div><div class="l">Solar fraction</div></div>
          <div class="kpi"><div class="v" id="kPeak">–</div><div class="l">Peak cut</div></div>
          <div class="kpi"><div class="v" id="kCo2">–</div><div class="l">CO₂ saved</div></div>
          <div class="kpi"><div class="v" id="kSave">–</div><div class="l">Est. saving</div></div>
          <div class="kpi"><div class="v" id="kPay">–</div><div class="l">Payback</div></div>
        </div>
        <div class="toggles">
          <div class="tg" role="group" aria-label="Storage technology">
            <button class="chip on" data-tech="battery">Battery</button>
            <button class="chip" data-tech="hydrogen">Hydrogen</button>
            <button class="chip" data-tech="thermal">Thermal</button>
          </div>
          <div class="tg" role="group" aria-label="Season">
            <button class="chip on" data-season="summer">Summer</button>
            <button class="chip" data-season="winter">Winter</button>
          </div>
        </div>
        <div class="ctl"><label><span id="sizeName">Battery size</span> <span id="capLbl"></span></label>
          <input type="range" id="capSlider" min="0" max="3000" step="100" value="1200"></div>
        <div class="technote" id="techNote"></div>
        <div class="ctl mini">
          <label>Grid price <span id="enLbl"></span></label>
          <input type="range" id="enSlider" min="120" max="420" step="10" value="280">
          <label>Export/SEG <span id="exLbl"></span></label>
          <input type="range" id="exSlider" min="0" max="150" step="5" value="50">
          <label>Capacity charge <span id="capchLbl"></span></label>
          <input type="range" id="capchSlider" min="0" max="200" step="10" value="120">
        </div>
        <div class="figcap">Pick a <b>technology</b> and <b>season</b>, size the store, and set the tariff. PV (gold) charges it; it discharges into the evening peak; the <b>grid-import</b> curve (green) shrinks. KPIs — including an estimated annual saving and payback — update live. <em>Illustrative browser model, not the validated PyPSA results.</em></div>
      </div>
    </aside>
  </section>`;
  const app=document.getElementById("app");
  app.querySelector(".hero")?.remove();
  app.querySelectorAll("section.sec").forEach(s=>s.remove());
  app.insertAdjacentHTML("beforeend",html);
  baseOrder=(d.sections||[]).map(s=>s.id);
  renderSections(d.sections);
  startSim(h);
  wireReader();wireReveal();wireSpy();wireProgress();buildPalette();
}
function renderSections(list){
  const app=document.getElementById("app");
  app.querySelectorAll("section.sec").forEach(s=>s.remove());
  app.insertAdjacentHTML("beforeend",list.map(renderSection).join(""));
  wireReveal();wireSpy();
}
function researchFigure(f){
  const sc=f.scenarios||[];const maxS=Math.max(...sc.map(x=>x.solar));
  const bars=sc.map(x=>{
    const h=Math.round(x.solar/maxS*120);
    return `<div class="rf-col"><div class="rf-bar" style="height:${h}px" title="${x.id}: ${x.solar}% solar, ${x.co2} tCO₂/yr"><span class="rf-val">${x.solar}%</span></div><div class="rf-lab">${esc(x.id)}</div><div class="rf-sub">${esc(x.label)}</div></div>`;
  }).join("");
  return `<div class="rfig"><div class="rf-chart">${bars}</div><div class="rf-axis mono">solar fraction (%) · hover for CO₂</div><div class="figcap">${md(f.caption)}</div></div>`;
}
function renderSection(s){
  let inner="";
  if(s.lead)inner+=`<div class="lead">${md(s.lead)}</div>`;
  if(s.body)inner+=`<div class="body">${md(s.body)}</div>`;
  if(s.figure&&s.figure.scenarios)inner+=researchFigure(s.figure);
  if(s.kind==="columns")inner+=`<div class="grid3">${(s.columns||[]).map(c=>`<div><h3>${esc(c.heading)}</h3><ul>${c.items.map(i=>`<li>${md(i)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(s.kind==="list")inner+=(s.items||[]).map(it=>`<div class="pub${it.featured?' feat':''}"><div class="t">${it.tag?`<span class="tag ${/Peer|Award/.test(it.tag)?'tag-key':''}">${esc(it.tag)}</span>`:""}${md(it.title)}</div>${it.meta?`<div class="m">${esc(it.meta)}</div>`:""}${it.note?`<div class="n">${md(it.note)}</div>`:""}</div>`).join("");
  if(s.kind==="timeline")inner+=`<div class="tl">${(s.items||[]).map(it=>`<div class="row"><div class="when">${esc(it.when)}</div><div><div class="what">${md(it.what)}</div>${it.note?`<div class="note">${md(it.note)}</div>`:""}</div></div>`).join("")}</div>`;
  if(s.kind==="links")inner+=`<div class="iconrow">${(s.items||[]).map(it=>{
      const key=(it.label||"").toLowerCase();
      const ic=ICONS[key]||(/^mailto:/.test(it.href)?ICONS.email:ICONS.link);
      const copy=/^mailto:/.test(it.href)?' data-copy="'+esc(it.value)+'"':'';
      const ext=/^https?:/.test(it.href)?' target="_blank" rel="noopener"':'';
      return `<a class="iconlk" href="${esc(it.href)}"${ext}${copy} aria-label="${esc(it.label)} — ${esc(it.value)}" title="${esc(it.label)}: ${esc(it.value)}">${ic}<span class="tip">${esc(it.label)}</span></a>`;
    }).join("")}</div>`;
  return `<section class="sec" id="${s.id}"><div class="head"><div class="num mono">${pad2(s.number)}</div><h2>${esc(s.title)}</h2></div><div class="content">${inner}</div></section>`;
}
function readerBlock(r){return `<div class="reader"><span class="lbl mono">Reading as</span>
  <div class="note">${md(r.intro)}</div>
  <div class="chips">${r.paths.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p.label)}</button>`).join("")}</div>
  <div class="note" id="readerNote"></div></div>`;}
function wireReader(){
  const paths=(DATA.hero.reader||{}).paths||[];
  document.querySelectorAll(".reader .chip").forEach(btn=>btn.addEventListener("click",()=>{
    const on=btn.classList.contains("on");
    document.querySelectorAll(".reader .chip").forEach(b=>b.classList.remove("on"));
    const note=document.getElementById("readerNote");
    if(on){note.innerHTML="";reorder(baseOrder,[]);return;}
    btn.classList.add("on");
    const p=paths[+btn.dataset.i];note.innerHTML=md(p.note);
    const pri=p.sections||[];reorder([...pri,...baseOrder.filter(id=>!pri.includes(id))],pri);
    try{localStorage.setItem("reader",btn.dataset.i)}catch(e){}
  }));
  try{const i=localStorage.getItem("reader");if(i!=null){const b=document.querySelector(`.chip[data-i="${i}"]`);if(b)b.click();}}catch(e){}
}
function reorder(order,spot){
  const app=document.getElementById("app");
  order.forEach(id=>{const el=document.getElementById(id);if(el)app.appendChild(el);});
  document.querySelectorAll("section.sec").forEach(s=>s.classList.toggle("spot",spot.includes(s.id)));
  wireReveal();
}
function wireReveal(){
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll("section.sec:not(.in)").forEach(s=>obs.observe(s));
}
function wireSpy(){
  const links=[...document.querySelectorAll(".nav a")];const map=new Map(links.map(a=>[a.getAttribute("href").slice(1),a]));
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove("on"));const a=map.get(e.target.id);if(a)a.classList.add("on");}}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section.sec,#top").forEach(s=>obs.observe(s));
}
function wireProgress(){
  const bar=document.getElementById("progress");
  const on=()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);bar.style.width=(p*100).toFixed(1)+"%";};
  document.addEventListener("scroll",on,{passive:true});on();
}
function startSim(h){
  const c=document.getElementById("simCanvas");if(!c||!window.EnergySim)return;
  const ctrl={
    cap:document.getElementById("capSlider"),
    energy:document.getElementById("enSlider"),
    exp:document.getElementById("exSlider"),
    capacity:document.getElementById("capchSlider"),
    techBtns:[...document.querySelectorAll("[data-tech]")],
    seasonBtns:[...document.querySelectorAll("[data-season]")]
  };
  const out={
    solar:document.getElementById("kSolar"),peak:document.getElementById("kPeak"),co2:document.getElementById("kCo2"),
    save:document.getElementById("kSave"),payback:document.getElementById("kPay"),
    capval:document.getElementById("capval"),capLbl:document.getElementById("capLbl"),
    sizeName:document.getElementById("sizeName"),techNote:document.getElementById("techNote")
  };
  // live labels for the tariff sliders
  const en=document.getElementById("enSlider"),ex=document.getElementById("exSlider"),cch=document.getElementById("capchSlider");
  const enL=document.getElementById("enLbl"),exL=document.getElementById("exLbl"),cchL=document.getElementById("capchLbl");
  const updLbls=()=>{enL.textContent="(£"+en.value+"/MWh)";exL.textContent="(£"+ex.value+"/MWh)";cchL.textContent="(£"+cch.value+"/kW/yr)";};
  [en,ex,cch].forEach(s=>s.addEventListener("input",updLbls));updLbls();
  window.EnergySim.mount(c,ctrl,out);
}
// command palette
function buildPalette(){
  const items=[];
  (DATA.sections||[]).forEach(s=>items.push({label:"Go to "+s.title,hint:pad2(s.number),run:()=>location.hash="#"+s.id}));
  items.push({label:"Toggle light / dark theme",hint:"theme",run:()=>document.getElementById("theme").click()});
  (DATA.sections||[]).filter(s=>s.id==="contact").forEach(s=>(s.items||[]).forEach(l=>{
    items.push({label:l.label+" — "+l.value,hint:"open",run:()=>window.open(l.href,l.href.startsWith("mailto")?"_self":"_blank")});
  }));
  const email=((DATA.sections||[]).find(s=>s.id==="contact")?.items||[]).find(i=>i.label==="Email");
  if(email)items.push({label:"Copy email address",hint:"copy",run:()=>{navigator.clipboard?.writeText(email.value);toast("Email copied");}});
  const pal=document.getElementById("pal"),input=document.getElementById("palInput"),list=document.getElementById("palList");
  let sel=0,shown=items;
  function draw(){list.innerHTML=shown.map((it,i)=>`<li class="${i===sel?'sel':''}" data-i="${i}">${esc(it.label)}<span class="hint">${esc(it.hint)}</span></li>`).join("");}
  function open(){pal.classList.add("open");input.value="";shown=items;sel=0;draw();input.focus();}
  function close(){pal.classList.remove("open");}
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();open();}
    else if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();open();}
    else if(e.key==="Escape")close();
    else if(pal.classList.contains("open")){
      if(e.key==="ArrowDown"){sel=(sel+1)%shown.length;draw();}
      else if(e.key==="ArrowUp"){sel=(sel-1+shown.length)%shown.length;draw();}
      else if(e.key==="Enter"&&shown[sel]){shown[sel].run();close();}
    }});
  input.addEventListener("input",()=>{const q=input.value.toLowerCase();shown=items.filter(it=>it.label.toLowerCase().includes(q));sel=0;draw();});
  list.addEventListener("click",e=>{const li=e.target.closest("li");if(li){shown[+li.dataset.i].run();close();}});
  pal.addEventListener("click",e=>{if(e.target===pal)close();});
}
// copy-on-click for mailto links
document.addEventListener("click",e=>{const a=e.target.closest("a[data-copy]");if(a&&navigator.clipboard){/* allow default mailto too */navigator.clipboard.writeText(a.dataset.copy);toast("Email copied");}});
// theme
document.getElementById("theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("theme",next)}catch(e){}
  document.dispatchEvent(new Event("themechange"));
});
(()=>{try{const t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();

// hamburger (mobile nav)
(function(){
  const btn=document.getElementById("hamburger"),nav=document.getElementById("nav");
  if(!btn||!nav)return;
  const close=()=>{nav.classList.remove("open");btn.setAttribute("aria-expanded","false");};
  btn.addEventListener("click",()=>{
    const open=nav.classList.toggle("open");
    btn.setAttribute("aria-expanded",open?"true":"false");
  });
  // close when a nav link is tapped (nav is populated after render, so delegate)
  nav.addEventListener("click",e=>{if(e.target.closest("a"))close();});
  // close on Escape or when resizing to desktop
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
  window.addEventListener("resize",()=>{if(window.innerWidth>640)close();});
})();



function mountGrid(){
  if(!window.GridWidget)return;
  const slot=document.getElementById("gridslot");if(!slot)return;
  slot.innerHTML=`<div class="gridcard"><canvas id="gridCanvas" aria-label="GB grid carbon intensity gauge"></canvas><div><div class="t">Live · Great Britain grid</div><div class="s" id="gridStatus">Loading current grid carbon intensity…</div></div></div>`;
  window.GridWidget.mount(document.getElementById("gridCanvas"),document.getElementById("gridStatus"));
}

fetch("content.json").then(r=>r.json()).then(d=>{render(d);mountGrid();}).catch(e=>{
  document.getElementById("app").insertAdjacentHTML("beforeend",`<p style="color:var(--muted);padding:40px 0">Could not load content.json — ${esc(e.message)}.</p>`);});
// service worker (offline / fast repeat loads)
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
